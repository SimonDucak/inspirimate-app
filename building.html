<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="5">
  <title>Building the app</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0B0E0C;
      color: #E9EEE9;
      font-family: system-ui, sans-serif;
    }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
    }
    p {
      margin: 0;
      max-width: 420px;
      line-height: 1.5;
      color: #8D9990;
    }
  </style>
</head>
<body>
  <main>
    <h1>Building the app</h1>
    <p>A new version is being built. This can take several minutes. The preview will update on its own when it is ready.</p>
  </main>
</body>
</html>
